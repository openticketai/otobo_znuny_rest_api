openapi: 3.2.1
info:
  title: Open Ticket AI Ticket System API
  description: |-
    Bearer-token REST API installed by the REST-API package on
    OTOBO and Znuny. Permissions are the bound agent or customer user.
    Webhook deliveries are outbound POSTs from the package, not a route on
    this server. Auth: Authorization: Bearer <token>. JSON only.
  version: 0.0.0
tags: []
paths:
  /v1/agents:
    get:
      operationId: Agents_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
        - BearerAuth: []
  /v1/auth/agent:
    post:
      operationId: Auth_agent
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /v1/config-items:
    get:
      operationId: ConfigItems_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigItemList'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
        - BearerAuth: []
  /v1/customer-users:
    get:
