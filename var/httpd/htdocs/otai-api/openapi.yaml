          type: string
        state:
          type: string
        priority:
          type: string
        type:
          type: string
        service:
          type: string
        State:
          type: string
        dynamic_fields:
          type: object
          unevaluatedProperties:
            type: string
    TicketWrite:
      type: object
      required:
        - title
        - queue
        - state
        - priority
        - type
        - service
        - customer_user
        - article
